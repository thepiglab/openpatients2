<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Articles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="color-scheme" content="light dark">
<title>Clinical Article Library</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <button id="toggle-library" class="icon-btn" type="button" aria-label="Show or hide the article list">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
  </button>
  <a class="brand" href="#" id="brand" title="Boing">
    <svg class="toad" viewBox="0 0 32 32" aria-hidden="true">
      <ellipse class="toad-body" cx="16" cy="20.5" rx="12.5" ry="8"/>
      <circle class="toad-body" cx="10" cy="12.5" r="4.6"/>
      <circle class="toad-body" cx="22" cy="12.5" r="4.6"/>
      <circle class="toad-eye" cx="10.4" cy="12" r="1.9"/>
      <circle class="toad-eye" cx="21.6" cy="12" r="1.9"/>
      <path class="toad-mouth" d="M11.5 21.5q4.5 3 9 0"/>
    </svg>
    <span>Clinical Article Library</span>
  </a>
  <div class="topbar-actions">
    <span id="sync" class="sync" role="status">Connecting…</span>
    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh" title="Refresh">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
    </button>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch light or dark theme" title="Light / dark">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
    </button>
  </div>
</header>

<div class="workspace">
  <aside class="library" aria-label="Articles">
    <div class="library-head">
      <h2>Articles</h2>
    </div>
    <div class="library-controls">
      <label class="search">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14"/></svg>
        <input id="search" type="search" placeholder="Search articles" aria-label="Search articles" autocomplete="off" spellcheck="false">
      </label>
      <div class="filter-row">
        <select id="status" aria-label="Review status">
          <option value="">All articles</option>
          <option value="schema_reviewed">Reviewed</option>
          <option value="source_reviewed">Source reviewed</option>
          <option value="pending">Not reviewed yet</option>
        </select>
        <select id="specialty" aria-label="Specialty"><option value="">Any specialty</option></select>
      </div>
      <div class="counts-row">
        <p id="counts" class="counts"></p>
        <button id="advanced-toggle" class="link-btn" type="button" aria-expanded="false" aria-controls="advanced">Filters</button>
      </div>
      <div id="advanced" class="advanced" hidden>
        <label>Patients<select data-filter="patients">
          <option value="">Any</option><option value="1">1 patient</option><option value="2-4">2–4 patients</option>
          <option value="5+">5 or more</option><option value="aggregate">Aggregate series only</option></select></label>
        <label>Figures<select data-filter="figures">
          <option value="">Any</option><option value="with">With figures</option><option value="without">No figures</option></select></label>
        <label>Figure review<select data-filter="figure_review">
          <option value="">Any</option><option value="described">AI described</option><option value="ehr">EHR labeled</option>
          <option value="privacy">Privacy flagged</option><option value="none">Figures not reviewed</option></select></label>
        <label>Tables<select data-filter="tables">
          <option value="">Any</option><option value="with">With tables</option><option value="without">No tables</option></select></label>
        <label>Supplements<select data-filter="supplements">
          <option value="">Any</option><option value="with">With supplements</option><option value="extracted">Supplement content extracted</option><option value="without">No supplements</option></select></label>
        <label>Article type<select data-filter="article_type"><option value="">Any</option></select></label>
        <label>License<select data-filter="license"><option value="">Any</option></select></label>
        <button id="advanced-reset" class="link-btn" type="button">Clear filters</button>
      </div>
    </div>
    <nav id="articles" class="article-list" aria-label="Article list"></nav>
    <p class="library-note">AI reference annotations, not physician-adjudicated.</p>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="reader" id="reader">
    <div class="pane-switch">
      <button type="button" id="show-source" class="active">Article</button>
      <button type="button" id="show-record">Extracted record</button>
    </div>
    <div class="reading-grid" id="reading-grid">
      <section class="sheet source-sheet" aria-label="Article">
        <div class="sheet-bar">
          <span class="sheet-label">Article</span>
          <label class="search find">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14"/></svg>
            <input id="text-search" type="search" placeholder="Find in article" aria-label="Find in article" autocomplete="off" spellcheck="false">
            <span id="find-count" class="find-count" aria-live="polite"></span>
          </label>
        </div>
        <div id="progress" class="progress" aria-hidden="true"></div>
        <div id="source-scroll" class="sheet-scroll">
          <header id="article-heading" class="article-head"><h1>Select an article</h1></header>
          <article id="source" class="article-text"></article>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>

      <section class="sheet record-sheet" aria-label="Extracted record">
        <div class="sheet-bar">
          <span class="sheet-label">Extracted record</span>
          <div id="patients" class="patients" role="tablist" aria-label="Patient"></div>
        </div>
        <div id="record" class="sheet-scroll record-content"></div>
      </section>

      <nav id="sections" class="sections" aria-label="Record sections"></nav>
    </div>
  </main>
</div>

<aside id="peek" class="peek" aria-label="Where this comes from in the article" hidden>
  <div class="peek-grip" id="peek-grip"><span></span></div>
  <div class="peek-head">
    <span class="peek-title">From the article</span>
    <span id="peek-count" class="peek-count"></span>
    <button id="peek-prev" class="icon-btn" type="button" aria-label="Previous quote">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>
    </button>
    <button id="peek-next" class="icon-btn" type="button" aria-label="Next quote">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
    </button>
    <button id="peek-close" class="icon-btn" type="button" aria-label="Close">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div id="peek-body" class="peek-body"></div>
  <button id="peek-open" class="peek-open" type="button">Read it in the article
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
  </button>
</aside>

<nav class="tabbar" id="tabbar" aria-label="Views">
  <button type="button" id="tab-library">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h7"/></svg>
    <span>Library</span>
  </button>
  <button type="button" id="tab-source" class="active">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.8h5.5L12.5 5v9.2h-8.5zM9.3 2v3.2h3M6.2 8.2h4.2M6.2 10.8h4.2"/></svg>
    <span>Article</span>
  </button>
  <button type="button" id="tab-record">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2.5h-2v12h9v-12h-2M5.5 1.5h5v2h-5zM5.5 7.5l1.5 1.5 3-3M5.5 11.5h5"/></svg>
    <span>Record</span><span id="tab-record-badge" class="tab-badge"></span>
  </button>
</nav>

<dialog id="lightbox" class="lightbox">
  <form method="dialog"><button class="icon-btn lightbox-close" aria-label="Close">✕</button></form>
  <img id="lightbox-img" alt="">
  <p id="lightbox-caption"></p>
</dialog>
</body>
</html>
