<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Clinical Article Library</title>
<link rel="stylesheet" href="style.css">
<script src="common.js" defer></script>
<script src="home.js" defer></script>
</head>
<body class="home">
<header class="topbar">
  <div class="brand">
    <button id="toad" class="toad-btn" type="button" aria-label="Boing" title="Boing">
      <svg class="toad" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse class="toad-body" cx="16" cy="20.5" rx="12.5" ry="8"/>
        <circle class="toad-body" cx="10" cy="12.5" r="4.6"/>
        <circle class="toad-body" cx="22" cy="12.5" r="4.6"/>
        <circle class="toad-eye" cx="10.4" cy="12" r="1.9"/>
        <circle class="toad-eye" cx="21.6" cy="12" r="1.9"/>
        <path class="toad-mouth" d="M11.5 21.5q4.5 3 9 0"/>
      </svg>
    </button>
    <span class="brand-title">Clinical Article Library</span>
  </div>
  <div class="topbar-actions">
    <a class="text-link" href="cohort.html">Cohort<span class="wide-only">&nbsp;builder</span></a>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch light or dark theme" title="Light / dark">
      <svg class="icon theme-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
      <svg class="icon theme-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
    </button>
    <a class="button-link" href="viewer.html">Open<span class="wide-only">&nbsp;the viewer</span>&nbsp;→</a>
  </div>
</header>

<main class="dash" id="dash">
  <section class="tile stat" id="t-articles"></section>
  <section class="tile stat" id="t-reviewed"></section>
  <section class="tile stat" id="t-patients"></section>
  <section class="tile stat" id="t-facts"></section>

  <section class="tile"><h2>Review status</h2><div id="c-status"></div></section>
  <section class="tile"><h2>Patients per article</h2><div id="c-size"></div></section>
  <section class="tile"><h2>Article type</h2><div id="c-type"></div></section>

  <section class="tile wide"><h2>Facts by record section</h2><div id="c-sections"></div></section>
  <section class="tile"><h2>Media</h2><div id="c-media"></div></section>

  <section class="tile full"><h2>Specialties <span class="muted">· reviewed of total</span></h2><div id="c-specialty"></div></section>

  <p class="dash-foot muted" id="foot"></p>
</main>
<div class="viz-tip" id="tip" role="tooltip" hidden></div>
</body>
</html>
