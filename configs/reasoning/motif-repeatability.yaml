pipeline: configs/pipelines/motif-pinned.yaml
output: runs/reasoning-motif-default
sample_size: 256
sample_seed: 1927
# No verified low/medium/high control is assumed for Motif-3.
# This measures variability within its DEFAULT mode only.
control_path: null
levels:
  - {name: default, value: default}
seeds: [17, 43, 101]
send_seed: true
max_tokens: 32768
bootstrap_resamples: 2000
permutation_resamples: 9999
gold: null
notes: >-
  Default-mode repeatability only; not a claim that Motif supports selectable reasoning levels.
  A documented model-specific control can be configured after verification.
