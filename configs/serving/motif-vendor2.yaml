name: motif-vendor2
backend: vllm
version: 0.26.0-motif3
image_reference: docker://ghcr.io/motiftechnologies/vllm:v0.26.0-motif3
sif: containers/motif-vllm026.sif
model_path: models/motif
model_id: Motif-Technologies/Motif-3-NVFP4
tensor_parallel: 1
data_parallel: 2
replicas: 1
expert_parallel: true
external_dp: false
reasoning_parser: motif
quantization: modelopt_nvfp4
speculation: mtp
speculative_tokens: 1
max_model_len: 65536
max_num_seqs: 128
max_batched_tokens: 16384
gpu_memory_utilization: 0.85
kv_cache_dtype: auto
prefix_cache: true
extra_args:
- --block-size
- '128'
experimental: false
validation_note: Vendor two-B200 topology. Project uses a smaller context and structured-output
  smoke; those settings still require validation.
