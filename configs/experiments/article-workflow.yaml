input: data/articles.jsonl
output: runs/article-workflow
endpoint: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
budget_usd: 25
concurrency: 8
article_concurrency: 3
validation_retries: 1
recover_citation_formatting: true
recover_identical_duplicates: true
targeted_item_repair: true
figure_attribution: true
figure_max_tokens: 6144
clinical_max_tokens: 16384
# TXT did not consistently outperform JATS for Glimmer in the small format study.
clinical_source: jats
allow_pdf_review: false
retry_failed: false
companion_tasks:
- summary
- timeline
clinical_tasks:
- case_context
- demographics
- conditions
- symptoms_function
- medications
- allergies
- procedures_devices
- observations
- oncology
- family_genetics
- reproductive_perinatal
- social_exposures
- outcomes
- care_plans
models:
- id: meta/muse-glimmer-30b
  context_length: 131072
  response_format: prompt_json
  max_input_per_million: 0.36
  max_output_per_million: 1.6
  extra_body:
    reasoning:
      effort: low
    provider:
      only:
      - together
      allow_fallbacks: false
      require_parameters: true
      max_price:
        prompt: 0.36
        completion: 1.6
budget_file: runs/article-workflow/budget.sqlite
request_deadline_seconds: 180
article_ids: null
reference_rosters: null
packet_scope: whole_article
