# HiPerGator CPU only; ten medical strata, case-focused and broader lanes.
# At most 120 candidates, 384 MB network and 512 MB stored source data.
lanes:
- name: cardiovascular_case_focused
  stratum: cardiovascular
  focus: case_focused
  query: (cardiac OR cardiovascular OR cardiology OR heart) AND ("case report" OR
    "case series" OR "case presentation")
  start: '2023-01-01'
  end: '2023-12-31'
  max_candidates: 6
- name: cardiovascular_broader
  stratum: cardiovascular
  focus: broader
  query: (cardiac OR cardiovascular OR cardiology OR heart)
  start: '2023-01-01'
  end: '2023-12-31'
  max_candidates: 6
