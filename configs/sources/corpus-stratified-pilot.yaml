# Cluster CPU download-only pilot: 10 topic strata, 30 case-focused + 10 broader
# candidates each. Overlapping IDs count in each lane but download only once.
# Purposive publication-date ordered prefixes, not an unbiased PMC sample.
# Caps are ceilings, never download targets; expand only in a NEW campaign.
lanes:
- name: cardiovascular_case_focused
  stratum: cardiovascular
  focus: case_focused
  query: (cardiac OR cardiovascular OR cardiology OR heart) AND ("case report" OR
    "case series" OR "case presentation")
  start: '2024-01-01'
  end: '2025-12-31'
  max_candidates: 30
- name: cardiovascular_broader
  stratum: cardiovascular
  focus: broader
  query: (cardiac OR cardiovascular OR cardiology OR heart)
  start: '2024-01-01'
  end: '2025-12-31'
  max_candidates: 10
