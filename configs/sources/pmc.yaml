# CPU-only URL discovery. No images, videos, PDFs, or supplements are downloaded.
cache: data/cache/literature.sqlite
concurrency: 8
cloud_requests_per_second: 8
identifier_requests_per_second: 2
identifier_batch_size: 200
contact_email_env: NCBI_EMAIL
retries: 3
timeout_seconds: 30
cache_ttl_days: 30
negative_cache_ttl_days: 1
max_metadata_bytes: 4000000
max_xml_bytes: 20000000
max_versions: 32
max_listing_pages: 20
offline: false
refresh: false
