[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpatients2"
version = "0.6.0"
description = "Evidence-grounded clinical case extraction, cohort indexing, and reproducible inference benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "httpx==0.28.1",
  "defusedxml==0.7.1",
  "numpy==2.3.5",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "prometheus-client==0.25.0",
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.34,<2", "transformers>=4.57.6,<6"]
pdf = ["pdf-inspector==1.25.2"]
plots = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
    "jinja2==3.1.6",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
op2 = "openpatients2.cli:main"
benchmark = "openpatients2.cli:benchmark_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openpatients2 = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
package = true
