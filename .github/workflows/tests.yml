name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      # The full suite includes real GEPA integration tests.
      - run: uv sync --locked --extra optimize
      - run: uv run --locked --extra optimize pytest -q
      - run: uv run --locked --extra optimize op2 --help
      - run: uv run --locked --extra optimize op2 ehr-pipeline --help
      - run: uv run --locked --extra optimize op2 dense --help
